name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          # SHA-256 from the official v8.30.1 release checksums.
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
      - name: Scan full Git history
        shell: bash
        run: |
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" git \
            --config .gitleaks.toml --redact --no-banner --log-opts="--all" .
