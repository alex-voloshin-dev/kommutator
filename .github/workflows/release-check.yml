name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - run: npm install --global --prefix "$RUNNER_TEMP/pnpm" --ignore-scripts pnpm@12.18.0
      - run: echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      - run: test "$(pnpm --version)" = 12.18.0
      - run: pnpm release:check
