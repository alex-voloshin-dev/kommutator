name: kommutator

services:
  hub:
    image: kommutator-hub:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${KOM_UID:-1000}:${KOM_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      KOM_HUB_BIND: 0.0.0.0
      KOM_HUB_PORT: "8787"
      KOM_HUB_DB: /data/kommutator.db
      KOM_KEY_FILE: /run/secrets/hub_key
    ports:
      - "${KOM_PUBLISH_HOST:-127.0.0.1}:${KOM_PUBLISH_PORT:-8787}:8787"
    volumes:
      - type: bind
        source: ${KOM_DATA_DIR:-${HOME}/.local/share/kommutator-hub}
        target: /data
        bind:
          create_host_path: false
    secrets:
      - hub_key
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    healthcheck:
      test: [CMD, node, /app/container/healthcheck.mjs]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  hub_key:
    file: ${KOM_KEY_FILE:-${HOME}/.config/kommutator-hub/hub.key}
